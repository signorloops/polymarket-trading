name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate runtime config template
        run: npm run runtime-config:validate -- ./config/trading-system.example.json

      - name: Run tests
        run: npm test
        env:
          NODE_OPTIONS: '--experimental-vm-modules'

      - name: Build project
        run: npm run build

      - name: Smoke test daemon startup
        run: npm run smoke:daemon:built

      - name: Smoke test Docker image startup
        run: npm run smoke:docker:built

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "Release $GITHUB_REF_NAME"

      - name: Publish to NPM
        if: ${{ !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'alpha') }}
        run: npm publish --access public --provenance
        env:
          # setup-node writes .npmrc with //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN};
          # npm publish reads NODE_AUTH_TOKEN, not NODE_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
