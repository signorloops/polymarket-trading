name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Validate runtime config template
        run: npm run runtime-config:validate -- ./config/trading-system.example.json

      - name: Run tests
        run: npm test
        env:
          NODE_OPTIONS: '--experimental-vm-modules'

      - name: Build project
        run: npm run build

      - name: Smoke test daemon startup
        run: npm run smoke:daemon:built

      - name: Smoke test Docker image startup
        run: npm run smoke:docker:built

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}

      - name: Publish to NPM
        if: '!contains(github.ref, "beta") && !contains(github.ref, "alpha")'
        run: npm publish --access public
        env:
          # setup-node writes .npmrc with //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN};
          # npm publish reads NODE_AUTH_TOKEN, not NODE_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
