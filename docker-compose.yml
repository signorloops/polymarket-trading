services:
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: polymarket-trading
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TRADING_SYSTEM_CONFIG_PATH: /app/config/trading-system.json
      HTTP_HOST: 0.0.0.0
      HTTP_METRICS_TOKEN_FILE: /run/secrets/metrics_token
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./config:/app/config:ro
      - state-data:/app/.state
    secrets:
      - metrics_token
    networks:
      - trading-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Development service with hot reload
  trading-bot-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: polymarket-trading-dev
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - trading-network
    profiles:
      - dev

  # Redis for caching (optional)
  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: polymarket-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - trading-network
    profiles:
      - with-redis

  # Prometheus for monitoring (optional)
  prometheus:
    image: prom/prometheus@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    container_name: polymarket-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    secrets:
      - metrics_token
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - trading-network
    profiles:
      - monitoring

  # Grafana for dashboards (optional)
  grafana:
    image: grafana/grafana@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    container_name: polymarket-grafana
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    secrets:
      - grafana_admin_password
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - trading-network
    profiles:
      - monitoring

volumes:
  state-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  trading-network:
    driver: bridge

secrets:
  metrics_token:
    file: ./.secrets/metrics-token
  grafana_admin_password:
    file: ./.secrets/grafana-admin-password
