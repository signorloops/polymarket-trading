global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'polymarket-trading'
    static_configs:
      - targets: ['trading-bot:3000']
    metrics_path: /metrics
    bearer_token_file: /run/secrets/metrics_token
    scrape_interval: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
